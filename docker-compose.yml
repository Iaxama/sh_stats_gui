services:
  app:
    build: .
    ports:
      - "5001:5001"
    env_file:
      - .github-sync-config
    volumes:
      - ./data:/app/data
      - .:/workspaces/sh_stats_gui:cached

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://app:5001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app

volumes:
  frontend_node_modules:
